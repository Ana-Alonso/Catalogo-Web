<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Página no encontrada | Laurel en Lienzo</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #0a0a0a;
        color: #fafafa;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      main {
        width: min(42rem, 100%);
        text-align: center;
      }

      p {
        color: #a3a3a3;
        line-height: 1.6;
      }

      .code {
        margin: 0;
        color: #ff751f;
        font-size: clamp(4rem, 18vw, 8rem);
        font-weight: 700;
        line-height: 1;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 10rem;
        padding: 0.85rem 1.25rem;
        border: 1px solid #404040;
        border-radius: 0.375rem;
        color: #fafafa;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
      }

      a:first-child {
        border-color: #ff751f;
        background: #ff751f;
      }

      a:focus-visible {
        outline: 2px solid #ff751f;
        outline-offset: 3px;
      }

      .english {
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid #262626;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Página no encontrada</h1>
      <p>La página que buscas no existe o se ha movido.</p>
      <div class="actions">
        <a href="/es" hreflang="es">Volver al catálogo</a>
        <a href="/en" hreflang="en">Go to English site</a>
      </div>
      <div class="english" lang="en">
        <h2>Page not found</h2>
        <p>The page you are looking for does not exist or has moved.</p>
      </div>
    </main>
  </body>
</html>
