<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Autorización de Etsy</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      main {
        width: min(36rem, 92vw);
        background: #171717;
        border: 1px solid #262626;
        border-radius: 0.75rem;
        padding: 2rem;
      }
      h1 { margin-top: 0; font-size: 1.25rem; letter-spacing: 0.04em; text-transform: uppercase; }
      p { color: #a3a3a3; line-height: 1.6; }
      code {
        display: block;
        padding: 1rem;
        border-radius: 0.5rem;
        background: #0a0a0a;
        border: 1px solid #262626;
        color: #fb923c;
        word-break: break-all;
        font-size: 0.8rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1rem;
        border: 0;
        border-radius: 0.375rem;
        background: #ea580c;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .hidden { display: none; }
      .error { color: #fca5a5; }
    </style>
    <script src="/etsy-callback.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Autorización de Etsy</h1>
      <p id="message">Procesando respuesta…</p>
      <p id="error" class="error hidden"></p>
      <div id="result" class="hidden">
        <p>Copia este código y ejecútalo en tu terminal:</p>
        <code id="code"></code>
        <p>Comando:</p>
        <code id="command"></code>
        <button id="copy" type="button">Copiar código</button>
        <p id="copied" class="hidden">Código copiado.</p>
      </div>
    </main>
  </body>
</html>
