name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (typecheck + production)
        run: npm run build

      - name: SQL suite (PostgreSQL 15)
        run: |
          if [ -f scripts/test-db.sh ]; then
            npm run test:db
          else
            echo "SQL suite skipped: scripts/test-db.sh is not present in the repository."
          fi
