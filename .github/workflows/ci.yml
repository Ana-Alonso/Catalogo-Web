name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard de secretos en el árbol versionado
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Hay archivos .env versionados: $tracked"
            exit 1
          fi
          if git grep -nEI '(service_role["'\''._-]{0,4}[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|xox[bpasr]-[A-Za-z0-9-]{20,})' -- ':!package-lock.json' ':!.env.example'; then
            echo "::error::Se detectó un secreto con formato conocido en archivos versionados."
            exit 1
          fi

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (typecheck + production)
        run: npm run build

      - name: SQL suite (PostgreSQL 15)
        run: npm run test:db
